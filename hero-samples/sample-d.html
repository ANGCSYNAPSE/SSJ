<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>D · Golden Hour · Shyam Jagat hero</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@600;700;800&family=Noto+Sans+Devanagari:wght@700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/base.css">
<style>
  /* D. Golden Hour: a cinematic push-in over the real temple gate, warm light, drifting bokeh, and mouse parallax. */
  .hero { background: #000; --px: 0px; --py: 0px; }
  .plate { position: absolute; inset: -5%; transition: transform .3s ease-out; transform: translate3d(var(--px), var(--py), 0); }
  .plate .kb { position: absolute; inset: 0; }
  .plate img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 42%; display: block; filter: saturate(1.05) sepia(.32) hue-rotate(-12deg) brightness(.92); }
  .fx { position: absolute; inset: 0; pointer-events: none; }
  .glow { position: absolute; inset: 0; mix-blend-mode: screen; background: radial-gradient(46% 40% at 50% 50%, rgba(255,160,50,.6), transparent 72%); }
  .warm { position: absolute; inset: 0; mix-blend-mode: soft-light; background: linear-gradient(180deg, #ff9a3c, #ff6a1f 60%, #7a1d00); opacity: .55; }
  .grade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(10,4,20,.6), transparent 40%, rgba(18,5,5,.92)); }
  .streak { position: absolute; inset: 0; overflow: hidden; mix-blend-mode: screen; }
  .streak i { position: absolute; top: 0; bottom: 0; width: 14%; background: linear-gradient(90deg, transparent, rgba(255,217,160,.4), transparent); animation: hl-sweep 8s ease-in-out infinite; }
  .vignette { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 45%, transparent 50%, rgba(0,0,0,.7) 100%); }
  .copy { position: relative; z-index: 10; display: flex; height: 100%; max-width: 1100px; flex-direction: column; align-items: center; justify-content: flex-end; gap: 24px; margin: 0 auto; padding: 0 24px 190px; text-align: center; }
  .copy .headline { justify-content: center; font-size: clamp(3.2rem, 7.4vw, 7.2rem); text-shadow: 0 4px 26px rgba(0,0,0,.85); }
  .copy .sub { text-shadow: 0 2px 10px rgba(0,0,0,.85); }
  .copy > * { animation: hl-in 1s cubic-bezier(.22,1,.36,1) both; }
  .copy > *:nth-child(2) { animation-delay: .2s; } .copy > *:nth-child(3) { animation-delay: .4s; }
  .foot { position: absolute; left: 0; right: 0; bottom: 0; z-index: 10; max-width: 1100px; margin: 0 auto; padding: 0 24px 82px; }
  .scroll { position: absolute; left: 50%; bottom: 76px; z-index: 10; width: 22px; height: 36px; border: 2px solid rgba(255,255,255,.7); border-radius: 12px; transform: translateX(-50%); display: none; }
</style>
</head>
<body>
<div data-header></div>

<section class="hero" id="hero">
  <div class="plate"><div class="kb hl-kb"><img src="assets/gate-day.png" alt="The Shree Shyam gateway" fetchpriority="high"></div></div>
  <div class="fx" id="fx">
    <div class="warm"></div><div class="glow"></div>
    <div class="grade"></div>
    <div class="streak"><i></i></div>
    <div id="bokeh" style="position:absolute;inset:0"></div>
    <div class="vignette"></div>
  </div>

  <div class="copy">
    <h1 class="headline"><span class="w1">सहयोग</span><span class="w2">सेवा</span><span class="w3">समर्पण</span></h1>
    <p class="sub">Shree Shyam Jagat is a platform dedicated to spreading devotion and serving humanity</p>
    <div data-ctas style="justify-content:center"></div>
  </div>
  <div class="foot"><div data-stats></div></div>
</section>

<div data-switch="d"></div>
<script src="assets/hero.js"></script>
<script>
  HL.bokeh(document.getElementById('bokeh'), 22);
  var hero = document.getElementById('hero');
  hero.addEventListener('mousemove', function (e) {
    var r = hero.getBoundingClientRect();
    hero.style.setProperty('--px', ((e.clientX - r.left) / r.width - 0.5) * -26 + 'px');
    hero.style.setProperty('--py', ((e.clientY - r.top) / r.height - 0.5) * -16 + 'px');
  });
</script>
</body>
</html>
