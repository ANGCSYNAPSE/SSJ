<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>E · Diya Night · Shyam Jagat hero</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@600;700;800&family=Noto+Sans+Devanagari:wght@700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/base.css">
<style>
  /* E. Diya Night: stars, Baba Shyam in a halo of turning rays, rising sparks, and a row of flickering lamps. */
  .hero { background: radial-gradient(ellipse at 72% 40%, #2d1654 0%, #150b30 42%, #05030f 100%); }
  .halo { position: absolute; right: 5%; top: 50%; width: min(640px, 50vw, 78vh); aspect-ratio: 1; transform: translateY(-54%); }
  .halo .rays { position: absolute; inset: -30%; opacity: .7; background: repeating-conic-gradient(from 0deg, rgba(255,208,79,.28) 0deg 4deg, transparent 4deg 15deg); -webkit-mask-image: radial-gradient(circle, #000 18%, transparent 62%); mask-image: radial-gradient(circle, #000 18%, transparent 62%); }
  .halo .glow { position: absolute; inset: -40px; border-radius: 50%; background: radial-gradient(circle, rgba(255,190,70,.45), transparent 65%); }
  .halo .r1 { position: absolute; inset: -12px; border: 1px solid rgba(246,220,140,.5); border-radius: 50%; }
  .halo .r2 { position: absolute; inset: -28px; border: 1px dashed rgba(246,220,140,.3); border-radius: 50%; }
  .halo .pic { position: absolute; inset: 0; overflow: hidden; border: 6px solid #f6dc8c; border-radius: 50%; background: #3a0c0c; box-shadow: 0 0 80px rgba(255,190,70,.5); }
  .halo .pic img { width: 100%; height: 100%; object-fit: cover; object-position: 62% 10%; display: block; }
  .halo .pic::after { content: ""; position: absolute; inset: 0; border-radius: 50%; box-shadow: inset 0 0 60px rgba(0,0,0,.5); }
  .copy { position: relative; z-index: 10; display: flex; height: 100%; max-width: 1440px; align-items: center; margin: 0 auto; padding: 0 clamp(24px, 5vw, 72px) 120px; }
  .copy > div { display: flex; max-width: min(640px, 47vw); flex-direction: column; gap: 26px; }
  .copy .headline { font-size: clamp(3.2rem, 6.1vw, 5.9rem); filter: drop-shadow(0 4px 14px rgba(0,0,0,.5)); }
  .copy .sub { color: rgba(255,255,255,.86); }
  .eyebrow { background: rgba(255,255,255,.05); }
  .lamps { position: absolute; left: 0; right: 0; bottom: 0; display: flex; align-items: flex-end; justify-content: space-between; padding: 0 clamp(12px, 3vw, 48px) 12px; }
  .lamps::before { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 112px; background: linear-gradient(0deg, rgba(255,155,25,.25), transparent); }
  .lamp { position: relative; width: clamp(40px, 4vw, 56px); height: clamp(40px, 4vw, 56px); filter: drop-shadow(0 0 14px rgba(255,170,60,.9)); }
  .lamp::before { content: ""; position: absolute; left: 50%; top: -14px; width: 56px; height: 56px; border-radius: 50%; background: rgba(255,179,71,.4); filter: blur(18px); transform: translateX(-50%); }
  .lamp svg { position: relative; }
  .foot { position: absolute; left: 0; right: 0; bottom: 84px; z-index: 10; max-width: 1000px; margin: 0 auto; padding: 0 24px; }
  @media (max-width: 960px) { .halo { opacity: .35; right: -20%; width: 90vw; } .copy > div { max-width: 100%; } .foot { display: none; } }
</style>
</head>
<body>
<div data-header></div>

<section class="hero">
  <div id="stars" style="position:absolute;inset:0"></div>
  <div class="halo">
    <div class="rays hl-spin-rays"></div>
    <div class="glow hl-pulse"></div>
    <span class="r1"></span><span class="r2"></span>
    <div class="pic"><img src="assets/baba.png" alt="Baba Shyam" fetchpriority="high"></div>
  </div>
  <div id="embers" style="position:absolute;inset:0;overflow:hidden;pointer-events:none"></div>

  <div class="copy">
    <div>
      <span class="eyebrow">Jai Shree Shyam</span>
      <h1 class="headline"><span class="w1">सहयोग</span><span class="w2">सेवा</span><span class="w3">समर्पण</span></h1>
      <p class="sub">Shree Shyam Jagat is a platform dedicated to spreading devotion and serving humanity</p>
      <div data-ctas></div>
    </div>
  </div>

  <div class="foot"><div data-stats></div></div>
  <div class="lamps" id="lamps" aria-hidden="true"></div>
</section>

<div data-switch="e"></div>
<script src="assets/hero.js"></script>
<script>
  HL.stars(document.getElementById('stars'), 70);
  HL.embers(document.getElementById('embers'), 18);
  var lamps = document.getElementById('lamps');
  for (var i = 0; i < 11; i++) {
    var d = document.createElement('span');
    d.className = 'lamp';
    d.style.marginBottom = (i % 3) * 6 + 'px';
    d.innerHTML = HL.diya().replace('id="ff"', 'id="ff' + i + '"').replace('url(#ff)', 'url(#ff' + i + ')');
    lamps.appendChild(d);
  }
</script>
</body>
</html>
